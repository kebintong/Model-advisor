<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Model Advisor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --ma-bg: #24262e;
      --ma-card: #2b2d36;
      --ma-card-hover: #323540;
      --ma-border: #3b3e4a;
      --ma-border-soft: #313440;
      --ma-text: #f0f1f5;
      --ma-sub: #9ea3b2;
      --ma-muted: #727786;
    }
    html[data-theme="light"] {
      --ma-bg: var(--color-background-primary, #ffffff);
      --ma-card: var(--color-background-secondary, #f6f8fa);
      --ma-card-hover: var(--color-background-tertiary, #eaeef2);
      --ma-border: var(--color-border-primary, #d0d7de);
      --ma-border-soft: var(--color-border-secondary, #e5e7eb);
      --ma-text: var(--color-text-primary, #1f2328);
      --ma-sub: var(--color-text-secondary, #656d76);
      --ma-muted: var(--color-text-tertiary, #8c959f);
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--ma-bg);
      color: var(--ma-text);
      font-family: "Google Sans", "Product Sans", var(--font-sans, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: 13px;
      line-height: 1.45;
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 18px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header + Underline Tabs (1:1 Swarm Overview match) */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .top-bar h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }
    .top-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .live-indicator {
      color: #68b684;
      font-size: 12px;
      font-weight: 550;
    }
    .status { font-size: 11px; color: var(--color-text-secondary, #8d93a1); }
    .status[data-tone="ok"] { color: #68b684; }
    .status[data-tone="err"] { color: #f87171; }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid var(--ma-border);
      margin-top: -4px;
    }
    .nav-tab {
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 0 2px 10px;
      margin-bottom: -1px;
      border: none;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--ma-sub);
      cursor: pointer;
    }
    .nav-tab:hover { color: var(--ma-text); }
    .nav-tab.active {
      color: var(--ma-text);
      font-weight: 600;
      border-bottom-color: var(--ma-text);
    }
    .nav-count {
      margin-left: 5px;
      font-size: 11.5px;
      color: var(--ma-muted);
    }

    /* Collapsible Summary Bar ("3 of 3 models ready") */
    .accordion-box {
      background: var(--ma-card);
      border: 1px solid var(--ma-border);
      border-radius: 10px;
      overflow: hidden;
    }
    .accordion-btn {
      font: inherit;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 14px;
      border: none;
      background: transparent;
      color: var(--ma-text);
      cursor: pointer;
      text-align: left;
    }
    .accordion-left {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
    }
    .check-circle {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      background: rgba(104, 182, 132, 0.16);
      color: #68b684;
      flex-shrink: 0;
    }
    .chevron {
      font-size: 15px;
      color: var(--color-text-secondary, #8d93a1);
      line-height: 1;
    }
    .summary-body {
      padding: 0 14px 12px;
      border-top: 1px solid var(--color-border-secondary, rgba(255, 255, 255, 0.06));
    }
    .summary-grid {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding-top: 10px;
      font-size: 12px;
      color: var(--color-text-secondary, #9ca3af);
    }

    /* Threads Section (exact single-line collapsible card) */
    .section-title {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 650;
      color: var(--color-text-primary, #eceef2);
    }
    .thread-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--color-text-secondary, #8d93a1);
    }
    .thread-bar {
      width: 28px;
      height: 3px;
      border-radius: 999px;
      background: #68b684;
      display: inline-block;
    }
    .thread-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #68b684;
      display: inline-block;
    }
    .thread-sub {
      color: var(--color-text-secondary, #8d93a1);
      font-weight: 400;
      margin-left: 6px;
    }
    .task-list {
      padding: 4px 10px 10px;
      border-top: 1px solid var(--color-border-secondary, rgba(255, 255, 255, 0.06));
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .task-row {
      font: inherit;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 6px 8px;
      border-radius: 7px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--color-text-primary, inherit);
      text-align: left;
      cursor: pointer;
    }
    .task-row:hover, .task-row.selected {
      background: var(--color-background-tertiary, rgba(255, 255, 255, 0.05));
      border-color: var(--color-border-primary, rgba(255, 255, 255, 0.1));
    }
    .task-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .task-check {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      background: rgba(104, 182, 132, 0.16);
      color: #68b684;
      flex-shrink: 0;
    }
    .task-check.working { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }
    .task-text { font-size: 12px; color: var(--color-text-secondary, #cbd5e1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px 2px 5px;
      border-radius: 999px;
      background: var(--pill-tint, rgba(255, 255, 255, 0.08));
      border: 1px solid var(--color-border-primary, rgba(255, 255, 255, 0.1));
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .task-model-tag {
      font-weight: 400;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10px;
      color: var(--color-text-secondary, #9ca3af);
    }

    /* "The team" Featured Card + Square Bee Selector (1:1 Swarm match) */
    .featured-card {
      background: var(--ma-card);
      border: 1px solid var(--ma-border);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .featured-main {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .honeycomb-tile {
      width: 68px;
      height: 68px;
      border-radius: 12px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--tile-tint, #1c1e26);
      background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1.2px, transparent 1.2px);
      background-size: 9px 9px;
      border: 1px solid var(--tile-border, #3b3e4a);
    }
    .honeycomb-tile.working .px-bee { animation: bee-bob 0.85s ease-in-out infinite; }
    .featured-body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .featured-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .featured-name { font-size: 14px; font-weight: 700; }
    .featured-sub { font-size: 12.5px; color: var(--color-text-secondary, #9ca3af); }
    .featured-action {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
      font-size: 11.5px;
      color: var(--color-text-tertiary, #7c8290);
    }
    .mini-dot { width: 6px; height: 6px; border-radius: 50%; background: #6c7280; }
    .mini-dot.working { background: #68b684; animation: dot-pulse 1s ease-in-out infinite; }
    .btn-link {
      font: inherit;
      font-size: 11.5px;
      font-weight: 550;
      border: none;
      background: transparent;
      color: var(--color-text-info, #60a5fa);
      cursor: pointer;
      padding: 0;
    }
    .btn-link:hover { text-decoration: underline; }

    .bee-strip {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 12px;
    }
    .bee-sq {
      font: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      border: none;
      background: transparent;
      color: var(--color-text-secondary, #8d93a1);
      cursor: pointer;
      padding: 0;
    }
    .bee-sq-box {
      width: 54px;
      height: 54px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--tile-tint, #1e2028);
      border: 1.5px solid var(--tile-border, #3b3e4a);
      transition: border-color 130ms ease, transform 130ms ease;
    }
    .bee-sq:hover .bee-sq-box { transform: translateY(-1px); }
    .bee-sq.selected .bee-sq-box {
      border-color: var(--color-text-primary, #eceef2);
      border-width: 1.8px;
    }
    .bee-sq.selected .bee-sq-label { color: var(--color-text-primary, #ffffff); font-weight: 600; }
    .bee-sq.working .px-bee { animation: bee-bob 0.85s ease-in-out infinite; }
    .bee-sq.working .px-wings, .honeycomb-tile.working .px-wings, .hex-cell.is-working .px-wings {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: wing-flutter 0.22s ease-in-out infinite;
    }
    .bee-sq-label { font-size: 11px; }
    .cluster-wrap { position: relative; width: 36px; height: 28px; }
    .cluster-wrap span { position: absolute; display: block; line-height: 0; }
    .cluster-wrap .cl-1 { left: 0; top: 0; }
    .cluster-wrap .cl-2 { right: 0; top: 2px; }
    .cluster-wrap .cl-3 { left: 8px; bottom: 0; }

    /* Graph Tab */
    .timeline-bar { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .icon-btn {
      font: inherit;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid var(--color-border-primary, rgba(255, 255, 255, 0.12));
      background: transparent;
      color: var(--color-text-primary, inherit);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 10px;
    }
    .scrub-track { flex: 1; height: 2.5px; border-radius: 999px; background: var(--color-border-primary, rgba(255, 255, 255, 0.14)); overflow: hidden; }
    .scrub-fill { height: 100%; width: 0%; background: var(--color-text-primary, #eceef2); transition: width 260ms ease; }
    .graph-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--color-text-secondary, #8d93a1); }
    /* Left-to-Right Fan-Out Graph (bigger stage + 64x64 tiles + active-only dots + hover tooltip) */
    .fan-canvas {
      position: relative;
      border-radius: 12px;
      background: var(--ma-card);
      border: 1px solid var(--ma-border);
      padding: 24px 16px 30px;
    }
    .fan-stage {
      position: relative;
      max-width: 460px;
      height: 244px;
      margin: 0 auto;
    }
    .hive-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }
    .fan-path {
      fill: none;
      stroke: #565a6a;
      stroke-width: 1.8;
      stroke-dasharray: 3 6;
      stroke-linecap: round;
      transition: stroke 160ms ease, stroke-width 160ms ease;
    }
    .fan-path.edge-active {
      stroke: #b0b6c6;
      stroke-width: 2.2;
      animation: dash-flow 0.85s linear infinite;
    }
    .dots-group {
      opacity: 0;
      transition: opacity 180ms ease;
    }
    .dots-group.dots-active {
      opacity: 1;
    }
    .g-node {
      position: absolute;
      width: 64px;
      height: 64px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--tile-tint, #1c1e26);
      border: 1.5px solid var(--tile-border, #3b3e4a);
      cursor: pointer;
      padding: 0;
      transition: border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease;
    }
    .g-node:hover { transform: translateY(-2px); border-color: var(--ma-text); }
    .g-node.is-selected {
      border-color: var(--ma-text);
      box-shadow: 0 0 0 1px var(--ma-text);
    }
    .g-node.is-working {
      border-color: var(--node-accent, #68b684);
      box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--node-accent, #68b684) 40%, transparent);
    }
    .g-node.is-working .px-bee { animation: bee-bob 0.85s ease-in-out infinite; }
    .g-node.is-working .px-wings {
      transform-box: fill-box;
      transform-origin: center bottom;
      animation: wing-flutter 0.22s ease-in-out infinite;
    }
    .g-coord { left: 16px; top: 90px; }
    .g-advisor { right: 16px; top: 6px; }
    .g-navigator { right: 16px; top: 90px; }
    .g-coder { right: 16px; top: 174px; }
    .g-tag {
      position: absolute;
      left: 50%;
      bottom: -20px;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--ma-sub);
      white-space: nowrap;
      pointer-events: none;
    }
    .graph-tooltip {
      position: absolute;
      left: 50%;
      bottom: 8px;
      transform: translateX(-50%);
      z-index: 10;
      min-width: 220px;
      max-width: 310px;
      padding: 8px 11px;
      border-radius: 9px;
      background: #1b1d24;
      border: 1px solid #454958;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.38);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .tt-head { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #f0f1f5; }
    .tt-badge { font-size: 10px; padding: 1px 6px; border-radius: 999px; border: 1px solid #454958; color: #9ea3b2; }
    .tt-state { margin-left: auto; font-size: 10px; font-weight: 600; color: #9ea3b2; }
    .tt-state.working { color: #68b684; }
    .tt-state.error { color: #f87171; }
    .tt-model { font-size: 11.5px; font-weight: 600; color: #cbd5e1; }
    .tt-desc { font-size: 11px; color: #9ea3b2; }
    .graph-ticker {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      padding: 9px 12px;
      border-radius: 9px;
      background: var(--ma-card);
      border: 1px solid var(--ma-border);
      flex-wrap: wrap;
    }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ma-muted); flex-shrink: 0; }
    .live-dot.active { background: #68b684; animation: dot-pulse 1s ease-in-out infinite; }
    .muted { color: var(--ma-sub); }

    /* Customize Tab */
    .swarm-box {
      background: var(--ma-card);
      border: 1px solid var(--ma-border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .swarm-box-head { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; font-weight: 600; }
    .btn-ghost {
      font: inherit;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid var(--color-border-primary, rgba(255, 255, 255, 0.14));
      background: transparent;
      color: var(--color-text-primary, inherit);
      cursor: pointer;
    }
    .btn-ghost:hover { background: var(--color-background-tertiary, rgba(255, 255, 255, 0.06)); }
    .btn-ghost.cmd-active {
      background: var(--color-background-inverse, #eceef2);
      color: var(--color-text-inverse, #111827);
      border-color: transparent;
      font-weight: 600;
    }
    .seg-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 3px;
      border-radius: 8px;
      background: var(--color-background-primary, #1f222a);
      border: 1px solid var(--color-border-primary, rgba(255, 255, 255, 0.1));
    }
    .seg-btn {
      font: inherit;
      font-size: 12px;
      font-weight: 550;
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--color-text-secondary, #8d93a1);
      cursor: pointer;
    }
    .seg-btn.active { background: var(--color-background-inverse, #eceef2); color: var(--color-text-inverse, #111827); }
    .mode-desc { margin: 2px 0 0; font-size: 12px; color: var(--color-text-secondary, #8d93a1); }
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--color-border-secondary, rgba(255, 255, 255, 0.08));
    }
    .toggle-title { font-weight: 600; font-size: 13px; }
    .toggle-sub { font-size: 12px; color: var(--color-text-secondary, #8d93a1); }
    .switch {
      position: relative;
      width: 38px;
      height: 22px;
      border-radius: 999px;
      border: 1px solid var(--color-border-primary, rgba(255, 255, 255, 0.16));
      background: rgba(255, 255, 255, 0.1);
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
    }
    .switch[data-checked="true"] { background: #68b684; border-color: transparent; }
    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      transition: transform 140ms ease;
    }
    .switch[data-checked="true"]::after { transform: translateX(16px); }
    .roles-list { display: flex; flex-direction: column; gap: 10px; }
    .role-card {
      background: var(--color-background-primary, rgba(0, 0, 0, 0.14));
      border: 1px solid var(--color-border-primary, rgba(255, 255, 255, 0.09));
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .role-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .role-id-wrap { display: flex; align-items: center; gap: 6px; }
    .mini-bee-dot { width: 8px; height: 8px; border-radius: 50%; }
    .role-handle { font-weight: 650; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .access-chip { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--color-border-primary, rgba(255, 255, 255, 0.14)); color: var(--color-text-secondary, #8d93a1); }
    .model-code { font-size: 11px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; padding: 1px 6px; border-radius: 4px; background: rgba(255, 255, 255, 0.06); color: var(--color-text-secondary, #8d93a1); }
    .role-desc { margin: 0; font-size: 12px; color: var(--color-text-secondary, #8d93a1); }
    .role-controls { display: flex; flex-direction: column; gap: 6px; }
    .model-select, .custom-input {
      width: 100%;
      font: inherit;
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--color-border-primary, rgba(255, 255, 255, 0.14));
      background: var(--color-background-secondary, #252832);
      color: var(--color-text-primary, #eceef2);
    }
    .custom-row { display: flex; gap: 6px; }
    .btn-apply { font: inherit; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 6px; border: none; background: var(--color-background-inverse, #eceef2); color: var(--color-text-inverse, #111827); cursor: pointer; }
    .chat-btns { display: flex; flex-wrap: wrap; gap: 6px; }
    .footer-row { font-size: 11px; color: var(--color-text-tertiary, #6c7280); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .hidden { display: none !important; }

    @keyframes bee-bob { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-4px); } }
    @keyframes wing-flutter { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.55); } }
    @keyframes dash-flow { to { stroke-dashoffset: -22; } }
    @keyframes hex-pulse { 0% { opacity: 0.7; transform: scale(1); } 100% { opacity: 0; transform: scale(1.16); } }
    @keyframes dot-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top-bar">
      <h1>Model Advisor</h1>
      <div class="top-right">
        <span id="status" class="status" data-tone="idle"></span>
