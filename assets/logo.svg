<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="ring" x1="20" y1="16" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <!-- Connecting triangle paths (10% safe padding inside 128x128) -->
  <path d="M64 26 L30 92 L98 92 Z" stroke="url(#ring)" stroke-width="6" stroke-linejoin="round" opacity="0.9"/>
  <!-- Center coordinator hub -->
  <circle cx="64" cy="68" r="9" fill="#818CF8"/>
  <!-- Top node: Advisor (Carbon) -->
  <circle cx="64" cy="26" r="12" fill="#6366F1" stroke="#E0E7FF" stroke-width="3"/>
  <!-- Bottom-left node: Navigator (Hydrogen) -->
  <circle cx="30" cy="92" r="12" fill="#0EA5E9" stroke="#E0F2FE" stroke-width="3"/>
  <!-- Bottom-right node: Coder (Neon) -->
  <circle cx="98" cy="92" r="12" fill="#10B981" stroke="#D1FAE5" stroke-width="3"/>
</svg>
